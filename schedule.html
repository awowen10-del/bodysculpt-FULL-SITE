<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Bodysculpt Scheduling</title>
<!-- v119: Inter, the one typeface for the whole suite. The system stack stays behind it
     as the fallback, so an offline/blocked load renders exactly as it did before. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ===================== THEME TOKENS =====================
     Every colour in this stylesheet resolves to one of these — there are no literal
     colours below this block. ONE theme: the neutral light palette. (v106 shipped a
     dark/light pair and v108 re-cut the light half; v121 dropped dark entirely, because
     it was never used. Every token NAME is unchanged, so all ~140 var(--x) references
     across the three pages still resolve.)
     The *-rgb tokens are bare "r,g,b" triples, so the many rgba(<accent>,<alpha>) tints
     throughout the stylesheet stay tied to the same single source of truth.
     The accents CARRY MEANING and must stay distinct from each other:
       orange = business / brand          teal  = recurring
       green  = training + done           blue  = home location, buffer, decisions
       amber  = watch / warning           red   = problem / delete
       info   = acquisition + decision panels   loc-warrington = the other location badge
     "orange" is a TOKEN NAME, not a promise of hue. Renaming it would touch every one of
     those references across three files, so the name stayed. */
  :root{
    /* ===== METRICS — not colours =====
       v121 put the ad-hoc numbers on scales. Radius was six values (8/10/12/16/20/pill)
       often nested inside each other; it is now three plus the pill. Spacing was 14/16/26
       used interchangeably for the same job; it is now a 4-based ramp. --radius is kept as
       the old name for the card radius so existing rules keep resolving. */
    --r-sm:6px;      /* chips, inputs, the small stuff inside a control */
    --r-md:10px;     /* buttons, selects, toolbars */
    --r-lg:14px;     /* cards, panels, modals */
    --r-pill:999px;
    --radius:var(--r-lg);
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
    /* motion + focus. Every interactive element takes --focus on :focus-visible. */
    --tap:.12s ease;
    --chev-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
    --focus:0 0 0 2px var(--card), 0 0 0 4px rgba(var(--orange-rgb),.55);
  }
  :root{
    color-scheme:light;
    /* THREE TIERS OF DEPTH, and they must stay three: the page (--navy) is a soft, slightly
       cool grey; the card (--card) is near-white and therefore visibly LIFTS off it; --line
       is a fine neutral hairline that draws the card's edge. Tone step + hairline do the
       work — the shadows below are deliberately soft. --navy-2 is the recessed inset inside
       a card (toolbars, sticky heads, sub-panels), so it sits BELOW the card, not above.
       v121 deepened the page a step and tightened the hairline, so a white card reads as an
       object on the page rather than blending into it. */
    --navy:#eef0f4; --navy-2:#e4e8ef; --card:#ffffff; --card-2:#f6f8fb;
    --line:#d9dee7; --line-rgb:217,222,231;
    /* dark-but-soft ink — a cool near-black, never #000; --ink-dim/-faint are muted greys.
       The ramp runs strong → ink → dim → faint, lightening at every step. */
    --ink:#171b22; --ink-dim:#59616f; --ink-faint:#737c8a; --ink-strong:#0b0e14;
    --ink-dim-rgb:89,97,111; --ink-faint-rgb:115,124,138;
    --on-accent:#fff;
    /* THE BRAND. v108 pointed this at a muted slate-blue, which was safe and completely
       anonymous — near enough the framework default that the app read as unbranded. v121
       brings back the terracotta the dark theme always had, deepened so it holds its own
       on a near-white card (5.44:1 on --card, and white on the solid fill is the same). */
    --orange:#b4471b; --orange-soft:#93380f; --orange-rgb:180,71,27; --orange-soft-rgb:147,56,15;
    --green:#17804d; --green-2:#0f6d40; --green-rgb:23,128,77; --green2-rgb:15,109,64;
    /* amber shifted yellower and red shifted toward crimson: both had to clear the brand by
       85 of summed RGB distance once the brand went warm, or "watch" and "problem" would
       have read as shades of the brand instead of as states. */
    --amber:#96700a; --amber-2:#85620a; --amber-rgb:150,112,10; --amber2-rgb:133,98,10;
    --red:#ab1338; --red-2:#911029; --red-rgb:171,19,56; --red2-rgb:145,16,41;
    --teal:#0d7d8a; --teal-soft:#0a6873; --teal-bright:#08555e; --teal-rgb:13,125,138;
    /* home/buffer is indigo; the Warrington badge moved off copper to plum in v121, because
       copper existed only to dodge a blue brand and now sat right on top of a warm one. */
    --blue:#6247b5; --blue-soft:#513a99; --blue-rgb:98,71,181;
    --info:#2b6cd9; --info-rgb:43,108,217;
    --loc-warrington:#7a3363; --grad-mid:#6d9a2e;
    /* the DEEP version of each accent — the chip behind them is a pale tint of the same
       hue, so a pale text colour would vanish */
    --tint-red:#8f1030; --tint-amber:#6f5308; --tint-green:#136540;
    --tint-blue:#46337f; --tint-orange:#8f3813;
    --panel-0:#f4f6fa; --panel-1:#eff2f8; --panel-2:#e8ecf4;
    --hero-1:#f6f8fc; --hero-2:#eef0f4; --hero-3:#e6eaf2;
    --mark-bg:#eaedf4; --chart-grid:#dfe4ee;
    /* a cool near-black scrim genuinely dims the page behind a modal; the shadow and the
       hover "lift" are the ink tone at low alpha, so a hover DARKENS the surface it sits on. */
    --backdrop-rgb:20,26,38;
    --shadow-rgb:23,27,34;
    --lift-rgb:23,27,34;
    /* TWO shadow steps, not one. A single large soft shadow on every card reads as haze on
       a light page: --shadow just separates a card from the ground, --shadow-lift is for
       things that genuinely float (modals, popovers, the week picker). */
    --shadow:0 1px 2px rgba(var(--shadow-rgb),.04), 0 1px 3px rgba(var(--shadow-rgb),.07);
    --shadow-lift:0 4px 6px -1px rgba(var(--shadow-rgb),.06), 0 12px 24px -6px rgba(var(--shadow-rgb),.14);
  }
  /* v121: every icon in the suite. Sized in em so it always matches its text, and drawn
     in currentColor so it always matches its colour — the whole reason the emoji went. */
  .ic{width:1em;height:1em;display:inline-block;vertical-align:-.135em;flex:0 0 auto;}
  .ic-lg{width:1.25em;height:1.25em;}
  /* v121: there was no :focus-visible styling anywhere in the suite. One ring, everywhere. */
  a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
  textarea:focus-visible,[tabindex]:focus-visible,[contenteditable]:focus-visible{
    outline:none;box-shadow:var(--focus);border-radius:var(--r-sm);}
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;} }
  /* v121: the collapse caret is one icon that rotates, not two different glyphs. */
  .chev .ic,.qsnap-chev .ic,.mp-chev .ic{transition:transform var(--tap);transform:rotate(-90deg);}
  .chev.open .ic,.open>.chev .ic,.qsnap-chev.open .ic{transform:rotate(0deg);}
  /* carets that used to be a " ▾" in a ::after. Masked so they still follow currentColor. */
  .chev-after::after{content:"";display:inline-block;width:.62em;height:.62em;margin-left:.34em;
    background:currentColor;vertical-align:.02em;
    -webkit-mask:var(--chev-mask) center/contain no-repeat;mask:var(--chev-mask) center/contain no-repeat;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--navy);color:var(--ink);}
  /* v94: the same container as the Weekly Dashboard's .wrap — max-width:1500px, centred,
     20px gutters — so the two pages render at one width. Weekly puts this on a .wrap div;
     here the body IS the container, so the same numbers live on it. Keep them in step. */
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.4;padding:0 20px 64px;max-width:1500px;margin:0 auto;}
  a{color:inherit;}
  h1{font-size:14.5px;font-weight:600;letter-spacing:-.012em;line-height:1.15;}
  .sub{font-size:10.5px;color:var(--ink-faint);font-weight:500;letter-spacing:.05em;
    text-transform:uppercase;margin-top:1px;}
  header{padding:18px 0 8px;}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .mark{width:32px;height:32px;border-radius:var(--r-md);overflow:hidden;flex:0 0 auto;
    border:1px solid var(--line);background:var(--mark-bg);}
  .monthpick{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim);}
  .periodbar{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--navy-2);
    border:1px solid var(--line);border-radius:12px;padding:8px 10px;}
  .pb-arrow{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;
    width:38px;height:36px;font-size:16px;font-weight:800;cursor:pointer;flex:0 0 auto;}
  .pb-arrow:hover:not(:disabled){border-color:var(--orange);color:var(--orange-soft);}
  .pb-arrow:disabled{opacity:.35;cursor:not-allowed;}
  .pb-label{flex:1;text-align:center;font-size:15px;font-weight:800;color:var(--ink-strong);letter-spacing:-.2px;}
  .pb-jump{background:var(--card);border:1px solid var(--line);color:var(--ink-dim);border-radius:8px;
    padding:8px 13px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto;}
  .pb-jump:hover{border-color:var(--orange);color:var(--ink);}
  .monthpick select{font-family:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;}
  /* ===================== v162: THE SIDE NAV =====================
     Ash: "I no longer want the navigation accessible from the top. I now want a side
     navigation" — with a reference: a quiet left rail, the brand at the top, small grey
     captions over groups of icon + label rows, and nothing competing with the page.
     The app bar (v121–v127) is gone. What it carried has moved, not changed: the same four
     groups in the same order, the same six links, one active per page, Finances still in
     the brand colour and still not a fourth period. The section tabs (.viewtoggle/#tabBar)
     stay in the page, because they steer the page's CONTENT, not which page you are on.

     How the page makes room: on a wide screen the rail is fixed to the left edge and the
     ROOT is padded by its width, so every page's centred 1500px shell centres itself in
     what is left — no page had to learn about the rail. Under 900px the rail becomes a
     drawer: a slim bar with the wordmark and a Menu button sits where the app bar was, and
     the rail slides in over the page with a scrim behind it. The rail is one block of
     markup and one block of CSS, byte-identical on all six pages. */
  @media(min-width:901px){ html{padding-left:236px;} }
  /* v163: FOLDED. Ash: "add an option, maybe two little arrows, to collapse the nav bar and
     have just icons instead of the full text, just in case I wanted more space on my main
     screen." A double chevron at the foot of the rail folds it to 72px: the mark stays,
     the words go, each icon keeps its name as a tooltip, and the root's padding shrinks
     with it so the page takes the space. The choice is kept per browser
     (localStorage bodysculpt:nav) and applied before first paint by the boot script in
     <head>. Folding is a wide-screen idea only — under 900px the rail is a drawer, always
     full width, and the button is hidden. */
  @media(min-width:901px){
    html.nav-collapsed{padding-left:72px;}
    html.nav-collapsed .sidenav{width:72px;padding-left:var(--sp-3);padding-right:var(--sp-3);}
    html.nav-collapsed .sn-brand{padding:0;justify-content:center;}
    html.nav-collapsed .sn-brand .mark{width:34px;height:34px;}
    html.nav-collapsed .sn-brand>div:not(.mark){display:none;}
    html.nav-collapsed .sn-cap{font-size:0;height:1px;background:var(--line);margin:2px 10px 10px;padding:0;}
    html.nav-collapsed .sn-money .sn-cap{background:rgba(var(--orange-rgb),.45);}
    html.nav-collapsed .sn-link{justify-content:center;padding:9px 0;gap:0;}
    html.nav-collapsed .sn-lbl{display:none;}
    html.nav-collapsed .sn-top{flex-direction:column;gap:var(--sp-3);}
    html.nav-collapsed .sn-fold .ic{transform:rotate(180deg);}
  }
  .sidenav{position:fixed;left:0;top:0;bottom:0;width:236px;z-index:90;display:flex;
    flex-direction:column;gap:var(--sp-5);padding:var(--sp-5) var(--sp-4);overflow-y:auto;
    background:var(--card);border-right:1px solid var(--line);}
  .sn-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
    padding:0 var(--sp-2);border-radius:var(--r-md);}
  .sn-brand:focus-visible{outline:none;box-shadow:var(--focus);}
  .sn-brand .mark{width:36px;height:36px;border-radius:var(--r-md);overflow:hidden;flex:0 0 auto;
    border:1px solid var(--line);background:var(--mark-bg);}
  .sn-brand h1{font-size:14.5px;font-weight:600;letter-spacing:-.012em;line-height:1.15;color:var(--ink-strong);}
  .sn-brand .sub{font-size:10.5px;color:var(--ink-faint);font-weight:500;letter-spacing:.05em;
    text-transform:uppercase;margin-top:1px;}
  .sn-nav{display:flex;flex-direction:column;gap:var(--sp-5);}
  .sn-group{display:flex;flex-direction:column;gap:2px;}
  /* the caption: small, grey, spaced — a heading for the rows under it, never a link */
  .sn-cap{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;
    color:var(--ink-faint);padding:0 12px;margin-bottom:6px;white-space:nowrap;}
  /* a row: an icon and a word. Plain text at rest; only the one you are on takes a soft
     chip — the v127 rule, kept: the accent is for actions, and where you are is stated
     quietly. */
  .sn-link{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:13.5px;
    font-weight:500;color:var(--ink-dim);padding:9px 12px;border-radius:var(--r-md);
    letter-spacing:-.005em;white-space:nowrap;transition:color var(--tap),background var(--tap);}
  .sn-link .ic{width:19px;height:19px;flex:0 0 auto;color:var(--ink-faint);transition:color var(--tap);}
  .sn-link:hover{color:var(--ink);background:var(--navy-2);}
  .sn-link:hover .ic{color:var(--ink);}
  .sn-link.active{background:var(--navy-2);color:var(--ink-strong);font-weight:600;}
  .sn-link.active .ic{color:var(--ink-strong);}
  .sn-link:focus-visible{outline:none;box-shadow:var(--focus);}
  /* Finances carries the brand as COLOUR — caption, label, icon, and a tinted chip when you
     are on it — never as a saturated fill. */
  .sn-money .sn-cap{color:var(--orange);}
  .sn-money .sn-link{color:var(--orange);font-weight:600;}
  .sn-money .sn-link .ic{color:var(--orange);}
  .sn-money .sn-link:hover{color:var(--orange-soft);background:rgba(var(--orange-rgb),.09);}
  .sn-money .sn-link.active{background:rgba(var(--orange-rgb),.12);color:var(--orange-soft);}
  .sn-money .sn-link.active .ic{color:var(--orange-soft);}
  /* the fold button: beside the brand at the top (v163.1 — Ash: "move it to the top"),
     quiet until hovered, gone in drawer mode */
  .sn-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);}
  .sn-fold{flex:0 0 auto;font-family:inherit;background:transparent;
    border:1px solid transparent;border-radius:var(--r-md);color:var(--ink-faint);cursor:pointer;
    width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;
    transition:color var(--tap),border-color var(--tap),background var(--tap);}
  .sn-fold .ic{width:18px;height:18px;transition:transform var(--tap);}
  .sn-fold:hover{color:var(--ink);border-color:var(--line);background:var(--navy-2);}
  .sn-fold:focus-visible{outline:none;box-shadow:var(--focus);}
  /* the narrow-screen bar and the scrim: both absent on a wide screen */
  .mobilebar{display:none;}
  .sn-scrim{display:none;}
  .vt-right{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);
    padding-left:var(--sp-4);}
  /* the section tabs: an underline row. It used to hang off the bottom of the app bar and
     borrowed its top edge; it is its own block now. */
  .viewtoggle{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:0 var(--sp-4);
    margin:0 0 var(--sp-4);overflow-x:auto;}
  /* v166: the plan side has no tab row — the row hides itself, and `hidden` must beat the
     display:flex above or the attribute would be ignored. */
  .viewtoggle[hidden]{display:none;}
  .viewtoggle .vt{flex:0 0 auto;font-family:inherit;font-size:13.5px;font-weight:500;
    color:var(--ink-dim);background:transparent;border:0;border-bottom:2px solid transparent;
    border-radius:0;padding:12px 15px 10px;cursor:pointer;white-space:nowrap;
    letter-spacing:-.005em;transition:color var(--tap),border-color var(--tap);}
  .viewtoggle .vt:hover{color:var(--ink);}
  .viewtoggle .vt.active{color:var(--ink);font-weight:600;border-bottom-color:var(--orange);}
  .viewtoggle .vt:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm);}
  @media(max-width:900px){
    .sidenav{transform:translateX(-100%);transition:transform .22s ease;box-shadow:none;}
    .sn-fold{display:none;}
    body.nav-open .sidenav{transform:none;box-shadow:var(--shadow-lift);}
    body.nav-open .sn-scrim{display:block;position:fixed;inset:0;z-index:85;
      background:rgba(var(--ink-dim-rgb),.45);}
    body.nav-open{overflow:hidden;}
    .mobilebar{display:flex;align-items:center;gap:var(--sp-3);position:sticky;top:0;z-index:60;
      min-height:56px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r-lg);padding:0 var(--sp-3);}
    .mbar-menu{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);
      background:transparent;border:1px solid var(--line);border-radius:var(--r-md);
      padding:7px 11px 7px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
    .mbar-menu .ic{width:18px;height:18px;}
    .mbar-menu:focus-visible{outline:none;box-shadow:var(--focus);}
    .mbar-name{font-size:14.5px;font-weight:600;letter-spacing:-.012em;color:var(--ink-strong);}
    .vt-right{padding-left:0;}
  }
  .actionbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;}
  .abtn{font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-md);padding:9px 14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;letter-spacing:-.005em;box-shadow:var(--shadow);
    transition:border-color var(--tap),background var(--tap);}
  .abtn:hover{border-color:var(--ink-faint);}
  .abtn.primary{background:var(--orange);color:var(--on-accent);border-color:transparent;font-weight:600;}
  .abtn.ghost{background:transparent;color:var(--ink-dim);}
  .abtn.primary{background:var(--orange);border-color:var(--orange);color:var(--on-accent);}
  .msg{font-size:12px;color:var(--ink-faint);}
  section{margin-top:18px;}
  .view[hidden]{display:none;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);}
  .card + .card{margin-top:14px;}
  .cardhead{display:flex;align-items:flex-start;justify-content:space-between;
    gap:var(--sp-3);margin-bottom:var(--sp-4);flex-wrap:wrap;}
  .cardhead>div:first-child{min-width:0;}
  .chead{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:16px;font-weight:700;
    letter-spacing:-.022em;line-height:1.2;color:var(--ink-strong);}
  .chead .mo{color:var(--ink-faint);font-weight:600;}
  .csub{font-size:12.5px;color:var(--ink-faint);margin-top:5px;line-height:1.45;max-width:56ch;}
  .csub:empty,.cal-key:empty{display:none;}
  .cardhead-r{display:flex;align-items:center;gap:var(--sp-2);flex:0 0 auto;}
  .cardhead .weeknav{margin-bottom:0;}
  .cardhead .weeknav .rng{flex:0 0 auto;min-width:0;}

  /* the explainer mark, and the one floating box it opens */
  .finfo{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
    padding:0;border:0;background:transparent;color:var(--ink-faint);border-radius:var(--r-pill);
    cursor:help;flex:0 0 auto;line-height:0;transition:color var(--tap),background var(--tap);}
  .finfo:hover{color:var(--orange);background:rgba(var(--orange-rgb),.10);}
  .finfo:focus-visible{outline:none;box-shadow:var(--focus);color:var(--orange);}
  .finfo .ic{width:14px;height:14px;}
  .tipbox{position:fixed;z-index:300;width:max-content;max-width:320px;background:var(--ink-strong);
    color:var(--card);font-size:12.5px;line-height:1.55;padding:11px 13px;border-radius:var(--r-md);
    box-shadow:var(--shadow-lift);pointer-events:none;}
  .tipbox .tipbox-t{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.09em;color:var(--card-2);opacity:.7;margin-bottom:5px;}

  /* Needs Review is a JOB, not a fifth number — one line you can act on, full width */
  .fin-alert{grid-column:1/-1;display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    font-family:inherit;cursor:pointer;background:rgba(var(--amber-rgb),.07);
    border:1px solid rgba(var(--amber-rgb),.3);border-radius:var(--radius);padding:13px 16px;
    color:var(--ink);transition:background var(--tap),border-color var(--tap);}
  .fin-alert:hover{background:rgba(var(--amber-rgb),.13);border-color:var(--amber);}
  .fin-alert:focus-visible{outline:none;box-shadow:var(--focus);}
  .fin-alert>.ic{width:17px;height:17px;color:var(--tint-amber);flex:0 0 auto;}
  .fin-alert .t{font-size:13.5px;line-height:1.45;flex:1;min-width:0;}
  .fin-alert .t b{color:var(--tint-amber);}
  .fin-alert .n{font-variant-numeric:tabular-nums;font-weight:800;color:var(--tint-amber);}
  .fin-alert .go{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
    color:var(--tint-amber);white-space:nowrap;flex:0 0 auto;}
  .fin-alert .go .ic{width:14px;height:14px;}
  @media(max-width:640px){ .fin-alert{flex-wrap:wrap;} .fin-alert .go{padding-left:28px;} }

  /* ===================== v135: THE DAILY DASHBOARD =====================
     The page you open with the first coffee. It answers two questions and asks none:
     what money broke overnight, and what email actually needs you. Everything on it is
     READ-ONLY — there is not a single write path on this page, by design, because a
     dashboard you might accidentally edit is a dashboard you read nervously. */

  /* the date, and how fresh what you are looking at is */
  .day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);
    flex-wrap:wrap;margin:var(--sp-4) 0 var(--sp-4);}
  .day-date{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink-strong);
    line-height:1.15;}
  .day-fresh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;
    color:var(--ink-faint);margin-top:6px;}
  .day-fresh .ic{width:13px;height:13px;}
  .day-fresh b{color:var(--ink-dim);font-weight:600;}
  .day-fresh .stale{color:var(--tint-amber);font-weight:600;}

  /* main column carries the long list; the rail carries the short, usually-empty ones */
  .day-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);
    gap:var(--sp-4);align-items:start;}
  @media(max-width:1020px){ .day-grid{grid-template-columns:1fr;} }
  .day-rail{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0;}
  .day-grid .card{padding:18px 20px 20px;}
  /* v157: the grid's gap is the spacing; a section margin on top of it made the gap under
     the calendar half as big again as every other gap on the page */
  .day-grid section,.day-rail .card + .card{margin-top:0;}

  /* --- the email hierarchy ---
     Four tiers, hardest first. The tier is stated by a coloured rail down the left of its
     rows rather than by four differently-shaped boxes: it is one list, read top to bottom,
     and the colour tells you where the line is between "before breakfast" and "this week". */
  .tier{margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:1px solid var(--line);}
  .tier:first-of-type{margin-top:0;padding-top:0;border-top:0;}
  .tier-h{display:flex;align-items:center;gap:9px;margin-bottom:var(--sp-2);min-height:26px;}
  .tier-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .tier-name{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
    color:var(--ink-dim);}
  .tier-n{font-size:11.5px;font-weight:700;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;}
  /* v160: the link to the label in Gmail is a quiet word with a glyph, not a full sentence
     repeated under every heading — and the two secondary controls sit together on the right */
  .tier-r{margin-left:auto;display:inline-flex;align-items:center;gap:2px;flex:0 0 auto;}
  .tier-open{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    font-weight:600;color:var(--ink-faint);text-decoration:none;padding:3px 7px;
    border-radius:var(--r-sm);transition:color var(--tap),background var(--tap);}
  .tier-open:hover{color:var(--orange);background:rgba(var(--orange-rgb),.09);}
  .tier-open .ic{width:12px;height:12px;}
  /* v160: a folded pile's heading IS the toggle — the "Show 18 for information" line under
     it was a second control for the same thing */
  .tier-fold{display:inline-flex;align-items:center;gap:9px;font-family:inherit;background:none;
    border:0;padding:3px 8px 3px 4px;margin-left:-4px;border-radius:var(--r-sm);cursor:pointer;
    color:inherit;transition:background var(--tap);}
  .tier-fold:hover{background:var(--card-2);}
  .tier-fold:focus-visible{outline:none;box-shadow:var(--focus);}
  .tier-fold .chev{width:13px;height:13px;color:var(--ink-faint);transition:transform var(--tap);}
  .tier-fold[aria-expanded="true"] .chev{transform:rotate(180deg);}
  .tier-blurb{font-size:11.5px;color:var(--ink-faint);}
  .tier-urgent .tier-dot{background:var(--red);}     .tier-urgent .tier-name{color:var(--tint-red);}
  .tier-today  .tier-dot{background:var(--amber);}   .tier-today  .tier-name{color:var(--tint-amber);}
  /* the dots are the colours the Gmail labels themselves are already wearing, so the page
     and the inbox agree at a glance: red, orange, blue, grey */
  .tier-week   .tier-dot{background:var(--blue);}    .tier-week   .tier-name{color:var(--tint-blue);}
  .tier-fyi    .tier-dot{background:var(--ink-faint);}
  /* v156: the two live sections */
  .tier-inbox  .tier-dot{background:var(--orange);}  .tier-inbox  .tier-name{color:var(--tint-orange);}
  .tier-other  .tier-dot{background:var(--ink-faint);}

  /* one email */
  .mail{display:block;text-decoration:none;color:inherit;position:relative;
    border:1px solid var(--line);border-left-width:3px;border-radius:var(--r-md);
    padding:10px 12px 10px 13px;margin-top:6px;background:var(--card);
    transition:border-color var(--tap),background var(--tap),transform var(--tap);}
  .mail:hover{background:var(--card-2);transform:translateX(2px);}
  .mail:focus-visible{outline:none;box-shadow:var(--focus);}
  .tier-urgent .mail{border-left-color:var(--red);}
  .tier-today  .mail{border-left-color:var(--amber);}
  .tier-week   .mail{border-left-color:var(--blue);}
  .tier-fyi    .mail{border-left-color:var(--line);}
  .tier-inbox  .mail{border-left-color:var(--orange);}
  .tier-other  .mail{border-left-color:var(--line);}
  .mail-top{display:flex;align-items:baseline;gap:9px;}
  .mail-from{font-size:12px;font-weight:700;color:var(--ink-dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:40%;flex:0 0 auto;}
  .mail-when{margin-left:auto;font-size:11px;color:var(--ink-faint);white-space:nowrap;
    flex:0 0 auto;font-variant-numeric:tabular-nums;}
  .mail-subj{font-size:13.5px;font-weight:600;color:var(--ink-strong);line-height:1.35;
    margin-top:3px;}
  .mail-why{font-size:12.5px;color:var(--ink-dim);line-height:1.5;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .mail-act{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.07em;margin-top:8px;padding:3px 8px;border-radius:var(--r-pill);
    background:var(--navy-2);color:var(--ink-dim);border:1px solid var(--line);}
  .tier-urgent .mail-act{background:rgba(var(--red-rgb),.09);color:var(--tint-red);
    border-color:rgba(var(--red-rgb),.24);}
  .tier-today .mail-act{background:rgba(var(--amber-rgb),.10);color:var(--tint-amber);
    border-color:rgba(var(--amber-rgb),.26);}

  /* --- v142: THE REPLY IS ALREADY WRITTEN ---
     The scheduled job drafts and saves a reply for anything that needs one, so most rows
     here are not a job, they are a decision: read it, send it. That deserves to look
     different from a row that still wants writing. */
  .mail-draft{display:block;margin-top:9px;padding:9px 11px;border-radius:var(--r-sm);
    background:rgba(var(--green-rgb),.06);border:1px solid rgba(var(--green-rgb),.24);
    border-left-width:2.5px;border-left-color:var(--green);}
  .mail-dhead{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.09em;color:var(--tint-green);}
  .mail-dhead .ic{width:12px;height:12px;}
  .mail-dgo{margin-left:auto;display:inline-flex;align-items:center;gap:4px;
    font-size:10.5px;font-weight:700;color:var(--tint-green);text-decoration:none;
    letter-spacing:0;text-transform:none;padding:2px 6px;border-radius:var(--r-sm);}
  .mail-dgo:hover{background:rgba(var(--green-rgb),.16);}
  .mail-dgo:focus-visible{outline:none;box-shadow:var(--focus);}
  .mail-dgo .ic{width:11px;height:11px;}
  .mail-dtext{font-size:12px;color:var(--ink-dim);line-height:1.5;margin-top:5px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}

  /* --- v147: getting rid of what does not need you ---
     The tools sit quietly until the row is under the cursor, because a list covered in
     buttons reads as a form rather than as a morning's post. On a touch screen there is no
     hover, so they are simply always there. */
  /* v160: the tools used to sit in a footer that reserved a whole empty line under every
     row while invisible — the "empty bottom" of each email. Now they float over the top
     right corner (over the timestamp) only while the row is under the cursor, and the row
     is exactly as tall as its words. A touch screen has no hover, so there they are a
     plain line under the row instead. */
  .mail-tools{position:absolute;top:6px;right:7px;display:flex;gap:2px;opacity:0;padding:2px;
    border-radius:var(--r-sm);background:var(--card-2);transition:opacity var(--tap);}
  .mail:hover .mail-tools,.mail-tools:focus-within{opacity:1;}
  @media(hover:none){
    .mail-tools{position:static;opacity:1;margin-top:6px;padding:0;background:none;
      flex-wrap:wrap;}
  }
  .mail-tool{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:11px;font-weight:600;
    color:var(--ink-faint);padding:4px 8px;border-radius:var(--r-sm);cursor:pointer;
    white-space:nowrap;transition:color var(--tap),background var(--tap);}
  .mail-tool .ic{width:12px;height:12px;}
  .mail-tool:hover{color:var(--tint-green);background:rgba(var(--green-rgb),.12);}
  .mail-tool.bin:hover{color:var(--tint-red);background:rgba(var(--red-rgb),.11);}
  .mail-tool:focus-visible{outline:none;box-shadow:var(--focus);}
  .tier-clear{font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-faint);
    background:none;border:0;padding:3px 7px;border-radius:var(--r-sm);cursor:pointer;
    white-space:nowrap;}
  .tier-clear:hover{color:var(--tint-green);background:rgba(var(--green-rgb),.12);}
  .tier-clear:focus-visible{outline:none;box-shadow:var(--focus);}

  /* --- v155: THE ROW UNFOLDS ---
     A row is a button now, not a link. Open, it stops sliding on hover and settles: the
     conversation, then the reply, then the buttons. The editor is deliberately plain — a
     textarea, the same one the check-in uses — because a reply is prose, not a form. */
  .mail{cursor:pointer;}
  .mail.open{background:var(--card-2);transform:none;cursor:default;}
  .mail.open>.mail-top,.mail.open>.mail-subj,.mail.open>.mail-act{cursor:pointer;}
  .mail.open .mail-tools{opacity:1;}
  .mail-open{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
  .msg{padding:8px 0;border-bottom:1px dashed var(--line);}
  .msg.latest{border-bottom:0;}
  .msg-h{display:flex;align-items:baseline;gap:8px;font-size:11.5px;color:var(--ink-faint);
    flex-wrap:wrap;}
  .msg-from{font-weight:700;color:var(--ink-dim);}
  .msg-me{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    color:var(--tint-blue);background:rgba(var(--blue-rgb),.10);padding:1px 6px;border-radius:var(--r-pill);}
  .msg-when{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .msg-peek{flex:1 1 100%;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:400;}
  details.msg>summary{list-style:none;cursor:pointer;}
  details.msg>summary::-webkit-details-marker{display:none;}
  details.msg[open]>summary .msg-peek{display:none;}
  .msg-body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.55;
    color:var(--ink);margin-top:5px;}
  .msg-quoted{font-size:11px;color:var(--ink-faint);font-style:italic;margin-top:4px;}
  .reply{margin-top:12px;padding:12px;border-radius:var(--r-md);background:var(--card);
    border:1px solid rgba(var(--green-rgb),.28);border-left-width:2.5px;border-left-color:var(--green);}
  .reply-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-dim);
    margin-bottom:8px;}
  .reply-h b{color:var(--ink-strong);}
  .reply-addr{color:var(--ink-faint);font-size:11.5px;}
  .reply-src{margin-left:auto;font-size:10px;font-weight:800;text-transform:uppercase;
    letter-spacing:.08em;color:var(--tint-green);}
  .reply-text{width:100%;box-sizing:border-box;font-family:inherit;font-size:13.5px;line-height:1.55;
    color:var(--ink);background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:10px 12px;resize:vertical;min-height:150px;}
  .reply-text:focus{outline:none;border-color:var(--orange);background:var(--card);}
  .reply-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .reply-ask{display:flex;gap:6px;margin-top:8px;}
  .reply-ask input{flex:1 1 auto;min-width:0;font-family:inherit;font-size:12.5px;color:var(--ink);
    background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;}
  .reply-ask input:focus{outline:none;border-color:var(--orange);background:var(--card);}
  .reply-ask .abtn{white-space:nowrap;}
  .reply-note{font-size:12px;color:var(--ink-faint);margin-top:7px;min-height:1em;}
  .reply-note.ok{color:var(--tint-green);}
  .reply-note.warn{color:var(--tint-red);}
  @media(max-width:560px){ .reply-ask{flex-direction:column;} }

  /* undo is OFFERED, not mentioned — nothing here should feel like a one-way door */
  .undobar{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-dim);
    background:rgba(var(--green-rgb),.07);border:1px solid rgba(var(--green-rgb),.26);
    border-radius:var(--r-md);padding:9px 12px;margin-bottom:12px;line-height:1.45;}
  .undobar .ic{width:14px;height:14px;color:var(--tint-green);flex:0 0 auto;}
  .undobar span{flex:1;min-width:0;}
  .undobtn{font-family:inherit;font-size:12px;font-weight:700;color:var(--tint-green);
    background:none;border:0;cursor:pointer;padding:3px 9px;border-radius:var(--r-sm);
    flex:0 0 auto;}
  .undobtn:hover{background:rgba(var(--green-rgb),.16);}
  .undobtn:focus-visible{outline:none;box-shadow:var(--focus);}

  /* the unread switch, and what it hides */
  .mailtog{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-dim);
    cursor:pointer;white-space:nowrap;user-select:none;}
  .mailtog input{accent-color:var(--orange);width:15px;height:15px;margin:0;}
  .tier-read{font-size:11px;color:var(--ink-faint);font-weight:500;}
  /* when read threads ARE shown, they are context rather than work, and read as such */
  .mail.read{background:var(--card-2);}
  .mail.read .mail-subj{font-weight:500;color:var(--ink-dim);}
  .mail.read .mail-from{color:var(--ink-faint);}

  /* --- money that needs you --- */
  .mrow{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);
    border-radius:var(--r-md);padding:11px 13px;margin-top:8px;background:var(--card);
    transition:border-color var(--tap),background var(--tap);}
  .mrow:hover{background:var(--card-2);border-color:var(--ink-faint);}
  .mrow:focus-visible{outline:none;box-shadow:var(--focus);}
  .mrow-top{display:flex;align-items:baseline;gap:10px;}
  .mrow-who{font-size:13.5px;font-weight:700;color:var(--ink-strong);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mrow-amt{margin-left:auto;font-size:14px;font-weight:800;flex:0 0 auto;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .mrow-why{font-size:12px;color:var(--ink-dim);line-height:1.45;margin-top:4px;}
  .mrow-when{font-size:11.5px;color:var(--ink-faint);margin-top:5px;line-height:1.5;}
  .mrow-when b{color:var(--tint-amber);font-weight:700;font-variant-numeric:tabular-nums;}
  .mrow.hot{border-color:rgba(var(--red-rgb),.34);background:rgba(var(--red-rgb),.045);}
  .mrow.hot .mrow-amt{color:var(--tint-red);}
  .mrow.warm{border-color:rgba(var(--amber-rgb),.32);background:rgba(var(--amber-rgb),.05);}
  .mrow.warm .mrow-amt{color:var(--tint-amber);}
  .mrow .due{font-weight:700;color:var(--tint-red);}
  /* what is keeping this row on screen. Quiet, but there — the fix for "why is this still
     showing?" is the page answering it, not the person having to ask. */
  .mrow .stillwhy{color:var(--ink-dim);}

  /* the group headings inside the money card */
  .mgroup{margin-top:var(--sp-4);}
  .mgroup:first-of-type{margin-top:0;}
  .mgroup-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);}
  .mgroup-h .ic{width:13px;height:13px;}

  /* What was checked and cleared. Quiet, but present: a card that silently drops rows is a
     card you stop trusting, and the whole point of v137 was to earn that trust back. */
  .cleared{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;line-height:1.5;
    color:var(--ink-faint);margin-top:var(--sp-3);padding-top:var(--sp-3);
    border-top:1px solid var(--line);}
  .cleared .ic{width:13px;height:13px;color:var(--tint-green);flex:0 0 auto;margin-top:1px;}
  .cleared b{color:var(--ink-dim);font-weight:700;}

  /* nothing wrong is a RESULT, and gets said properly rather than left blank */
  .allclear{display:flex;align-items:center;gap:10px;padding:16px 4px;font-size:13px;
    color:var(--ink-dim);line-height:1.5;}
  .allclear .ic{width:18px;height:18px;color:var(--tint-green);flex:0 0 auto;}

  /* the state where an integration is not switched on yet: instructions, not an error */
  .cardhead-r{flex:0 0 auto;}
  .setup{border:1px dashed var(--line);border-radius:var(--r-md);padding:14px 15px;
    background:var(--card-2);font-size:12.5px;line-height:1.6;color:var(--ink-dim);}
  .setup b{color:var(--ink-strong);}
  .setup ol{margin:8px 0 0;padding-left:18px;}
  .setup li{margin-top:5px;}
  /* ===================== v170: SCHEDULING =====================
     Ash: "The ability to be able to pull videos in from Google Drive and schedule it is
     incredible, I want that in my system." A Drive folder is the inbox; each video is a
     card that goes new → captioned → scheduled → out. Two views: the queue, and a month. */
  .sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;margin-top:6px;}
  .sc-title{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink-strong);line-height:1.15;}
  .sc-sub{font-size:12.5px;color:var(--ink-dim);margin-top:5px;}
  .sc-sub b{color:var(--ink-strong);font-weight:600;}
  .sc-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .muted{font-size:13px;color:var(--ink-faint);line-height:1.5;}
  /* the filter chips over the queue */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 12px;}
  .chip{font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-dim);background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-pill);padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .chip b{font-weight:700;color:var(--ink-faint);}
  .chip.on{color:var(--ink-strong);border-color:var(--ink-faint);background:var(--navy-2);}
  .chip.on b{color:var(--ink-strong);}
  /* a video */
  .qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  .qc{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;}
  .qc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line);}
  .qc.ready::before{background:var(--amber);}
  .qc.scheduled::before{background:var(--teal);}
  .qc.published::before{background:var(--green);}
  .qc.captioning::before,.qc.scheduling::before{background:var(--blue);}
  .qc.skipped{opacity:.7;}
  .qc-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:12px 14px 0 16px;align-items:start;}
  .qc-thumb{aspect-ratio:9/16;max-height:150px;width:100%;border-radius:var(--r-sm);background:var(--navy-2);border:1px solid var(--line);
    object-fit:cover;display:block;}
  .qc-thumb.blank{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:11px;}
  .qc-name{font-size:14px;font-weight:700;color:var(--ink-strong);line-height:1.3;overflow-wrap:anywhere;letter-spacing:-.01em;}
  .qc-when{font-size:11.5px;color:var(--ink-faint);margin-top:3px;}
  .qc-status{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r-pill);
    border:1px solid transparent;color:var(--ink-dim);background:var(--navy-2);white-space:nowrap;}
  .pill.ready{color:var(--amber-2);background:rgba(var(--amber-rgb),.14);}
  .pill.scheduled{color:var(--teal);background:rgba(var(--teal-rgb),.13);}
  .pill.published{color:var(--green-2);background:rgba(var(--green-rgb),.12);}
  .pill.working{color:var(--blue-soft);background:rgba(var(--blue-rgb),.12);}
  .pill.failed{color:var(--red-2);background:rgba(var(--red-rgb),.11);}
  .qc-out{font-size:12.5px;color:var(--ink);margin-top:6px;}
  .qc-out b{font-weight:600;}
  .qc-body{padding:12px 14px 14px 16px;display:flex;flex-direction:column;gap:10px;}
  .qc-body textarea{font-family:inherit;font-size:13px;line-height:1.5;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-md);padding:9px 11px;min-height:120px;resize:vertical;width:100%;}
  .qc-body input[type=text],.qc-body input[type=datetime-local]{font-family:inherit;font-size:13px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;width:100%;}
  .qc-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;margin-bottom:4px;display:block;}
  .qc-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .plats{display:flex;flex-wrap:wrap;gap:6px;}
  .plat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-dim);border:1px solid var(--line);border-radius:var(--r-pill);
    padding:5px 10px;cursor:pointer;background:var(--card);}
  .plat input{accent-color:var(--orange);}
  .plat.on{color:var(--ink-strong);border-color:var(--ink-faint);background:var(--navy-2);}
  .qc-err{font-size:12.5px;color:var(--red-2);background:rgba(var(--red-rgb),.07);border:1px solid rgba(var(--red-rgb),.25);border-radius:var(--r-md);padding:8px 10px;}
  .qc-note{font-size:12px;color:var(--ink-faint);}
  .qc-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;}
  .qc-acts .l,.qc-acts .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .qc-view{font-size:12.5px;color:var(--ink);white-space:pre-wrap;line-height:1.5;background:var(--navy-2);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 11px;}
  details.qc-tr summary{cursor:pointer;font-size:12px;color:var(--ink-dim);font-weight:600;}
  details.qc-tr p{font-size:12px;color:var(--ink-dim);white-space:pre-wrap;margin-top:6px;line-height:1.5;max-height:160px;overflow:auto;}
  /* the month */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .cal-month{font-size:16px;font-weight:700;color:var(--ink-strong);letter-spacing:-.02em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
  .cal-dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:700;text-align:center;padding-bottom:2px;}
  .cal-day{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .cal-day.pad{background:transparent;border-color:transparent;}
  .cal-day.today{border-color:var(--orange);}
  .cal-n{font-size:11.5px;font-weight:600;color:var(--ink-faint);}
  .cal-day.today .cal-n{color:var(--orange);}
  .cal-ev{font-size:11px;line-height:1.3;border-radius:var(--r-sm);padding:3px 6px;color:var(--ink);background:rgba(var(--teal-rgb),.13);border-left:3px solid var(--teal);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
  .cal-ev.published{background:rgba(var(--green-rgb),.12);border-left-color:var(--green);}
  .cal-ev b{font-weight:700;}
  @media(max-width:720px){
    .qcards{grid-template-columns:1fr;}
    .qc-row{grid-template-columns:1fr;}
    .cal-grid{gap:3px;} .cal-day{min-height:64px;padding:4px;} .cal-ev{font-size:10px;}
  }
</style>

<script>
/* v162: the side nav's drawer, on a narrow screen. Menu opens it, the scrim or Escape
   closes it; on a wide screen the rail is simply there and none of this runs. */
(function () {
  var btn = document.getElementById("mbarMenu"), scrim = document.getElementById("snScrim");
  function setOpen(open) {
    document.body.classList.toggle("nav-open", open);
    if (btn) btn.setAttribute("aria-expanded", String(open));
  }
  if (btn) btn.addEventListener("click", function () { setOpen(!document.body.classList.contains("nav-open")); });
  if (scrim) scrim.addEventListener("click", function () { setOpen(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setOpen(false); });
  // v163: the fold. One class on <html>, remembered per browser; the boot script in <head>
  // re-applies it before paint next time.
  var fold = document.getElementById("snFold");
  function setFolded(on) {
    document.documentElement.classList.toggle("nav-collapsed", on);
    if (fold) {
      fold.setAttribute("aria-label", on ? "Unfold the menu" : "Fold the menu to icons");
      fold.setAttribute("title", on ? "Unfold the menu" : "Fold the menu");
    }
    try { localStorage.setItem("bodysculpt:nav", on ? "collapsed" : "open"); } catch (e) {}
  }
  if (fold) {
    if (document.documentElement.classList.contains("nav-collapsed")) setFolded(true);
    fold.addEventListener("click", function () { setFolded(!document.documentElement.classList.contains("nav-collapsed")); });
  }
  // v165: the rail's mark follows the page's tab. "Weekly" and "Weekly KPIs" are the same
  // page on different tabs, so whichever tab is showing is the link that reads as current.
  // The page calls this from its own tab switch; pages with no KPI link ignore it.
  var q = function (sel) { return document.querySelector ? document.querySelector(sel) : null; };
  var own = q(".sn-link.active");
  var kpi = own ? q('.sn-link[href="' + own.getAttribute("href") + '#kpi"]') : null;
  window.snMarkActive = function (onKpi) {
    if (!own || !kpi) return;
    own.classList.toggle("active", !onKpi);
    kpi.classList.toggle("active", !!onKpi);
  };
})();

/* =====================================================================
   SCHEDULING — v170.
   The queue lives in the store (netlify/lib/schedule.js); this page draws it and sends
   Ash's decisions back. Three addresses, and nothing else:
     SQ         the queue — read, scan Drive, edit, skip, cancel
     CAPTION    "write the caption for this one" (background: answers at once, works for minutes)
     PUBLISH    "schedule this one" (background, the same)
   While anything is captioning or scheduling the page re-reads the queue every four
   seconds until it settles. Every typed edit is saved on blur, so nothing is lost to a
   re-render — the rule the mail card learned in v155.
   ===================================================================== */
const SQ = "/.netlify/functions/schedule-queue";
const CAPTION = "/.netlify/functions/schedule-caption-background";
const PUBLISH = "/.netlify/functions/schedule-publish-background";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const PLAT_LABEL = { instagram: "Instagram", facebook: "Facebook", tiktok: "TikTok", youtube: "YouTube" };
const STATUS_LABEL = { new: "Needs a caption", ready: "Ready to schedule", captioning: "Writing the caption…", scheduling: "Sending to Zernio…", scheduled: "Scheduled", published: "Posted", skipped: "Skipped" };
const STATUS_TONE = { ready: "ready", scheduled: "scheduled", published: "published", captioning: "working", scheduling: "working" };
const FILTERS = [["todo", "To do", (it) => it.status === "new" || it.status === "ready" || it.status === "captioning" || it.status === "scheduling"],
  ["scheduled", "Scheduled", (it) => it.status === "scheduled"], ["published", "Posted", (it) => it.status === "published"], ["skipped", "Skipped", (it) => it.status === "skipped"]];

let cfg = null, queue = null, loadError = "", filter = "todo", view = "queue", pollTimer = null;
let calYear, calMonth;

async function sget(url) {
  let res;
  try { res = await fetch(url, { headers: { accept: "application/json" } }); } catch { throw new Error("The scheduling service is unreachable."); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) throw new Error(body.error || ("The scheduling service returned " + res.status + "."));
  return body;
}
async function spost(url, payload) {
  let res;
  try { res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", accept: "application/json" }, body: JSON.stringify(payload) }); } catch { throw new Error("The scheduling service is unreachable."); }
  if (res.status === 202) return { ok: true };
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.ok === false) throw new Error(body.error || ("The scheduling service returned " + res.status + "."));
  return body;
}

const fmtWhen = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const fmtDay = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
// <input type=datetime-local> wants local wall-clock "YYYY-MM-DDTHH:MM"
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

/* ---------- the head line and the setup box ---------- */
function renderHead() {
  const sub = $("scSub"), box = $("scSetup");
  if (loadError) { sub.textContent = ""; box.innerHTML = '<div class="setup"><b>' + esc(loadError) + "</b></div>"; return; }
  if (!cfg) return;
  const q = queue || [];
  const n = (f) => q.filter(f).length;
  sub.innerHTML = cfg.drive
    ? "<b>" + n((it) => it.status === "new" || it.status === "ready") + "</b> to do · <b>" + n((it) => it.status === "scheduled") + "</b> scheduled · <b>" + n((it) => it.status === "published") + "</b> posted"
    : "Google Drive is not connected yet.";
  const missing = [];
  if (!cfg.drive) missing.push("<li><b>Google Drive</b> — the inbox. Share a folder as <i>anyone with the link can view</i>, then add <code>GOOGLE_DRIVE_API_KEY</code> and <code>GOOGLE_DRIVE_FOLDER_ID</code> in Netlify.</li>");
  if (!cfg.gemini) missing.push("<li><b>Gemini</b> — transcribes the video so the caption is about what is actually said. Add <code>GEMINI_API_KEY</code>. Without it, captions are written from the file name only.</li>");
  if (!cfg.zernio) missing.push("<li><b>Zernio</b> — does the posting. Add <code>ZERNIO_API_KEY</code> and an account id per platform (<code>ZERNIO_ACCOUNT_INSTAGRAM</code> …). Until then, Schedule is switched off.</li>");
  box.innerHTML = missing.length
    ? '<div class="setup" style="margin-top:14px"><b>Not everything is connected yet.</b> SCHEDULE-SETUP.md has the steps.<ol>' + missing.join("") + "</ol></div>"
    : "";
}

/* ---------- the queue ---------- */
function chipsHtml() {
  const q = queue || [];
  return FILTERS.map(([k, label, f]) => '<button type="button" class="chip' + (filter === k ? " on" : "") + '" data-filter="' + k + '">' + esc(label) + " <b>" + q.filter(f).length + "</b></button>").join("");
}
function cardHtml(it) {
  const working = it.status === "captioning" || it.status === "scheduling";
  const editable = it.status === "new" || it.status === "ready";
  const plats = (cfg && cfg.platforms.length ? cfg.platforms : ["instagram", "facebook", "tiktok", "youtube"]);
  const chosen = new Set(it.platforms || []);
  const platsHtml = plats.map((p) => '<label class="plat' + (chosen.has(p) ? " on" : "") + '"><input type="checkbox" data-plat="' + p + '"' + (chosen.has(p) ? " checked" : "") + (editable ? "" : " disabled") + "> " + esc(PLAT_LABEL[p] || p) + "</label>").join("");
  let body = "";
  if (editable) {
    body = '<div><span class="qc-lbl">Caption</span><textarea data-field="caption" placeholder="' + (it.status === "new" ? "Press Write caption, or type your own…" : "") + '">' + esc(it.caption) + "</textarea></div>" +
      (plats.includes("youtube") ? '<div><span class="qc-lbl">YouTube title</span><input type="text" data-field="ytTitle" value="' + esc(it.ytTitle) + '" placeholder="Under 80 characters"></div>' : "") +
      '<div class="qc-row"><div><span class="qc-lbl">Where</span><div class="plats">' + platsHtml + "</div></div>" +
      '<div><span class="qc-lbl">When</span><input type="datetime-local" data-field="scheduledFor" value="' + esc(toLocalInput(it.scheduledFor)) + '"></div></div>' +
      (it.hasTranscript ? '<details class="qc-tr"><summary>What is said in the video</summary><p data-transcript>Loading…</p></details>' : "");
  } else if (it.status === "scheduled" || it.status === "published") {
    body = '<div class="qc-view">' + esc(it.caption) + "</div>" +
      '<div class="qc-out"><b>' + (it.status === "published" ? "Posted" : "Goes out") + "</b> " + esc(fmtWhen(it.scheduledFor)) + " · " + (it.platforms || []).map((p) => esc(PLAT_LABEL[p] || p)).join(", ") + "</div>";
  } else if (working) {
    body = '<p class="muted">' + esc(STATUS_LABEL[it.status]) + " This can take a few minutes for a long video. The card updates on its own.</p>" + (it.caption ? '<div class="qc-view">' + esc(it.caption) + "</div>" : "");
  } else {
    body = it.caption ? '<div class="qc-view">' + esc(it.caption) + "</div>" : "";
  }
  let acts = "";
  if (editable) {
    acts = '<div class="l"><button type="button" class="abtn" data-act="caption"><svg class="ic"><use href="#ic-note"/></svg> ' + (it.caption ? "Rewrite caption" : "Write caption") + "</button>" +
      '<button type="button" class="abtn ghost" data-act="skip">Skip</button></div>' +
      '<div class="r"><button type="button" class="abtn primary" data-act="publish"' + (cfg && cfg.zernio ? "" : ' disabled title="Zernio is not connected yet"') + '><svg class="ic"><use href="#ic-calendar"/></svg> Schedule</button></div>';
  } else if (it.status === "scheduled") {
    acts = '<div class="l"><button type="button" class="abtn ghost" data-act="cancel">Cancel</button></div><div class="r"><span class="qc-note">Zernio will post it.</span></div>';
  } else if (it.status === "skipped") {
    acts = '<div class="l"><button type="button" class="abtn" data-act="restore">Bring back</button><button type="button" class="abtn ghost" data-act="remove">Remove</button></div>';
  } else if (it.status === "published") {
    acts = '<div class="l"><button type="button" class="abtn ghost" data-act="remove">Remove from list</button></div>';
  }
  return '<article class="qc ' + esc(it.status) + '" data-id="' + esc(it.id) + '">' +
    '<div class="qc-top"><img class="qc-thumb" src="' + esc(it.thumb) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=&quot;qc-thumb blank&quot;>No preview</div>\'">' +
    '<div><div class="qc-name">' + esc(it.name) + '</div><div class="qc-when">Added to Drive ' + esc(fmtDay(it.createdTime || it.addedAt)) + " · " + (/^video\//.test(it.mime || "") ? "Video" : "Image") + "</div>" +
    '<div class="qc-status"><span class="pill ' + (STATUS_TONE[it.status] || "") + '">' + esc(STATUS_LABEL[it.status] || it.status) + "</span></div>" +
    (it.error ? '<div class="qc-err" style="margin-top:8px">' + esc(it.error) + "</div>" : "") + "</div></div>" +
    '<div class="qc-body">' + body + (acts ? '<div class="qc-acts">' + acts + "</div>" : "") + "</div></article>";
}
function renderQueue() {
  const box = $("queue"), chips = $("chips");
  chips.innerHTML = chipsHtml();
  if (loadError) { box.innerHTML = ""; return; }
  if (!queue) { box.innerHTML = '<div class="loading">Loading the queue…</div>'; return; }
  const f = FILTERS.find(([k]) => k === filter)[2];
  const items = queue.filter(f);
  if (!items.length) {
    box.innerHTML = '<div class="setup">' + (filter === "todo"
      ? (cfg && cfg.drive ? "<b>Nothing waiting.</b> Drop a video in the Drive folder and press Check Drive." : "<b>Connect Google Drive</b> and the videos in your folder appear here.")
      : "<b>Nothing here.</b>") + "</div>";
    return;
  }
  box.innerHTML = '<div class="qcards">' + items.map(cardHtml).join("") + "</div>";
}
function renderAll() { renderHead(); renderQueue(); renderMonth(); schedulePoll(); }

/* ---------- the month ---------- */
function renderMonth() {
  const grid = $("calGrid"), title = $("calMonth");
  if (!grid) return;
  const first = new Date(calYear, calMonth, 1);
  title.textContent = first.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const today = new Date(); const tKey = today.getFullYear() + "-" + today.getMonth() + "-" + today.getDate();
  const byDay = {};
  for (const it of (queue || [])) {
    if (!(it.status === "scheduled" || it.status === "published") || !it.scheduledFor) continue;
    const d = new Date(it.scheduledFor); const k = d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    (byDay[k] = byDay[k] || []).push(it);
  }
  let html = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => '<div class="cal-dow">' + d + "</div>").join("");
  const lead = (first.getDay() + 6) % 7;          // Monday-based, like every week in this suite
  for (let i = 0; i < lead; i++) html += '<div class="cal-day pad"></div>';
  const days = new Date(calYear, calMonth + 1, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const k = calYear + "-" + calMonth + "-" + d;
    const evs = (byDay[k] || []).sort((a, b) => a.scheduledFor < b.scheduledFor ? -1 : 1);
    html += '<div class="cal-day' + (k === tKey ? " today" : "") + '"><span class="cal-n">' + d + "</span>" +
      evs.map((it) => '<div class="cal-ev ' + esc(it.status) + '" data-id="' + esc(it.id) + '" title="' + esc(it.name + " — " + (it.caption || "").slice(0, 120)) + '"><b>' +
        esc(new Date(it.scheduledFor).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })) + "</b> " + esc(it.name) + "</div>").join("") + "</div>";
  }
  grid.innerHTML = html;
}

/* ---------- loading and polling ---------- */
async function load(scan) {
  const btn = $("scanBtn"); btn.disabled = true;
  try {
    const r = await sget(SQ + (scan ? "?scan=1" : ""));
    cfg = r.configured; queue = r.queue; loadError = "";
    if (scan && r.scan && r.scan.error) loadError = "Drive: " + r.scan.error;
  } catch (e) { loadError = (e && e.message) || "Could not load the queue."; }
  btn.disabled = false;
  renderAll();
}
function schedulePoll() {
  clearTimeout(pollTimer);
  if ((queue || []).some((it) => it.status === "captioning" || it.status === "scheduling")) pollTimer = setTimeout(() => load(false), 4000);
}

/* ---------- Ash's decisions ---------- */
async function update(id, patch) {
  try {
    const r = await spost(SQ, { op: "update", id, ...patch });
    const i = queue.findIndex((it) => it.id === id); if (i >= 0 && r.item) queue[i] = { ...queue[i], ...r.item, thumb: queue[i].thumb, hasTranscript: queue[i].hasTranscript };
    renderHead();
  } catch (e) { const it = queue.find((x) => x.id === id); if (it) { it.error = e.message; renderQueue(); } }
}
async function act(id, what) {
  const it = queue.find((x) => x.id === id); if (!it) return;
  try {
    if (what === "caption") { it.status = "captioning"; it.error = ""; renderAll(); await spost(CAPTION, { id }); setTimeout(() => load(false), 3000); return; }
    if (what === "publish") {
      const problem = !it.caption ? "Write or type the caption first." : !(it.platforms || []).length ? "Pick at least one platform." : !it.scheduledFor ? "Pick a date and time." : "";
      if (problem) { it.error = problem; renderQueue(); return; }
      it.status = "scheduling"; it.error = ""; renderAll(); await spost(PUBLISH, { id }); setTimeout(() => load(false), 3000); return;
    }
    const r = await spost(SQ, { op: what, id });
    if (what === "remove") queue = queue.filter((x) => x.id !== id);
    else if (r.item) Object.assign(it, r.item);
    renderAll();
  } catch (e) { it.error = (e && e.message) || "That did not work."; renderQueue(); }
}

/* ---------- wiring ---------- */
(function init() {
  const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
  $("scanBtn").addEventListener("click", () => load(true));
  $("chips").addEventListener("click", (e) => { const b = e.target.closest("[data-filter]"); if (b) { filter = b.dataset.filter; renderQueue(); } });
  const q = $("queue");
  q.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    act(b.closest("[data-id]").dataset.id, b.dataset.act);
  });
  q.addEventListener("change", (e) => {
    const card = e.target.closest("[data-id]"); if (!card) return;
    const id = card.dataset.id, it = queue.find((x) => x.id === id); if (!it) return;
    if (e.target.dataset.plat) {
      const set = new Set(it.platforms || []); e.target.checked ? set.add(e.target.dataset.plat) : set.delete(e.target.dataset.plat);
      it.platforms = [...set]; e.target.closest(".plat").classList.toggle("on", e.target.checked);
      update(id, { platforms: it.platforms });
    } else if (e.target.dataset.field === "scheduledFor") {
      const v = e.target.value ? new Date(e.target.value).toISOString() : null; it.scheduledFor = v; update(id, { scheduledFor: v });
    }
  });
  // typed text is saved when the box loses focus — a re-render cannot eat it
  q.addEventListener("focusout", (e) => {
    const f = e.target.dataset && e.target.dataset.field; if (!f || f === "scheduledFor") return;
    const card = e.target.closest("[data-id]"); const it = queue.find((x) => x.id === card.dataset.id); if (!it) return;
    if (it[f] === e.target.value) return;
    it[f] = e.target.value; if (f === "caption" && it.status === "new" && it.caption) it.status = "ready";
    update(it.id, { [f]: e.target.value });
  });
  // the transcript is fetched only when asked for — it is not sent with the list
  q.addEventListener("toggle", (e) => {
    const d = e.target; if (!d.classList || !d.classList.contains("qc-tr") || !d.open) return;
    const p = d.querySelector("[data-transcript]"); if (!p || p.dataset.loaded) return;
    const id = d.closest("[data-id]").dataset.id;
    sget(SQ + "?transcript=" + encodeURIComponent(id)).then((r) => { p.textContent = r.transcript || "—"; p.dataset.loaded = "1"; }).catch(() => { p.textContent = "Could not load it."; });
  }, true);
  $("calPrev").addEventListener("click", () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderMonth(); });
  $("calNext").addEventListener("click", () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderMonth(); });
  $("calGrid").addEventListener("click", (e) => { const ev = e.target.closest("[data-id]"); if (!ev) return; setView("queue"); filter = "scheduled"; renderQueue(); const el = document.querySelector('.qc[data-id="' + ev.dataset.id + '"]'); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
  document.querySelectorAll("#tabBar .vt").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  load(true);
})();
function setView(v) {
  view = v;
  document.querySelectorAll("#tabBar .vt").forEach((b) => b.classList.toggle("active", b.dataset.view === v));
  $("v-queue").hidden = v !== "queue"; $("v-month").hidden = v !== "month";
  if (v === "month") renderMonth();
}
</script>
</body>
</html>
