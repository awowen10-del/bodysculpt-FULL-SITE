[build]
  publish = "."
  functions = "netlify/functions"

# The AI review call (mentor-ai) can take longer than the default 10s, especially for
# the large quarterly prompt. Raise its timeout to the paid-plan maximum (26s).
[functions."mentor-ai"]
  timeout = 26

# v135: the Daily Dashboard's Stripe read. Four parallel list calls to Stripe — comfortably
# inside 10s in normal conditions, but a slow morning at Stripe should degrade into a slow
# card, not a timed-out one.
[functions."stripe-feed"]
  timeout = 26

# ===================== v167: Facebook Ads (the ad-intelligence tool, moved in) =====================
# The ads tool's seven functions came across from bodysculpt-ad-intelligence, prefixed
# `ads-` so nothing collides. The page talks to them at /api/ads/…; these rewrites (200,
# so the function sees the original path) send each address to its function. The two
# specific ones must come BEFORE the catch-all — first matching rule wins.
[[redirects]]
  from = "/api/ads/daily-check/generate"
  to = "/.netlify/functions/ads-daily-check-background"
  status = 200

[[redirects]]
  from = "/api/ads/daily-check"
  to = "/.netlify/functions/ads-daily-check"
  status = 200

[[redirects]]
  from = "/api/ads/sync-status"
  to = "/.netlify/functions/ads-sync-status"
  status = 200

[[redirects]]
  from = "/api/ads/sync-trigger"
  to = "/.netlify/functions/ads-sync-trigger"
  status = 200

[[redirects]]
  from = "/api/ads/*"
  to = "/.netlify/functions/ads-api/:splat"
  status = 200

# The nightly Meta sync: a tiny cron trigger that invokes ads-sync-background (15-min
# wall, locked to SYNC_TRIGGER_SECRET). 04:00 UTC = 05:00 UK summer / 04:00 winter.
[functions."ads-sync-scheduled"]
  schedule = "0 4 * * *"

# The read API opens a database connection per request; give it the paid-plan maximum
# rather than the 10s default, the same as mentor-ai and stripe-feed above.
[functions."ads-api"]
  timeout = 26
[functions."ads-daily-check"]
  timeout = 26
[functions."ads-sync-status"]
  timeout = 26

# v169: the follower count, written down once a day so the Content page can draw growth.
# 04:30 UTC, after the ads sync. The page also asks it to record on every visit.
[functions."ig-snapshot"]
  schedule = "30 4 * * *"

# v172: competitors' views. A nightly scrape of each watched account's public page (Apify),
# triggered the same way as the ads sync: the scheduled function asks the background one.
[functions."ig-scrape-scheduled"]
  schedule = "0 5 * * *"
